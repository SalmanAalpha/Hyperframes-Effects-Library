<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>demo: ringCountdown</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="moves.css" />
    <style>
      @font-face { font-family: "Manrope"; src: url("fonts/manrope-latin.woff2") format("woff2"); font-weight: 200 800; }
      :root { --page:#f6f7f9; --ink:#161b26; --sec:#4b5565; --muted:#687182; --blue:#2a78d6; --line:#e3e6eb; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--page); }
      #stage { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Manrope", sans-serif; color:var(--ink); background:var(--page); }
      .blue { color:var(--blue); }
      .big { font-weight:600; font-size:66px; letter-spacing:-0.035em; line-height:1.15; }
      .mid { font-weight:600; font-size:50px; letter-spacing:-0.03em; line-height:1.25; color:var(--sec); }
      .layer { position:absolute; inset:0; }
      .demo-label { position:absolute; left:60px; top:1740px; font-weight:700; font-size:22px; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase; }
      .sample { position:absolute; font-weight:700; font-size:20px; letter-spacing:0.16em; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 18px; }
      #ring { position:absolute; left:290px; top:560px; }
      #cap { position:absolute; left:80px; right:80px; top:1200px; text-align:center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920" data-fps="30">
      <div id="all" class="clip" data-start="0" data-duration="4" data-track-index="0" style="position:absolute; inset:0" data-layout-allow-overflow data-layout-allow-occlusion>

        <div id="ring"></div>
        <div id="cap" class="big">One recurring job:<br /><span class="blue">about 45 hours to 5.</span></div>
        <div class="demo-label">move · ringCountdown</div>
      </div>
    </div>
    <script src="moves.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 4);

      HRMoves.ringCountdown(tl, "#ring", 0.2, { from: 45, to: 5, unit: "hours" });
      HRMoves.blurIn(tl, "#cap", 0.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
