<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>demo: stampSlam</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="moves.css" />
    <style>
      @font-face { font-family: "Manrope"; src: url("fonts/manrope-latin.woff2") format("woff2"); font-weight: 200 800; }
      :root { --page:#f6f7f9; --ink:#161b26; --sec:#4b5565; --muted:#687182; --blue:#2a78d6; --line:#e3e6eb; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--page); }
      #stage { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Manrope", sans-serif; color:var(--ink); background:var(--page); }
      .blue { color:var(--blue); }
      .big { font-weight:600; font-size:66px; letter-spacing:-0.035em; line-height:1.15; }
      .mid { font-weight:600; font-size:50px; letter-spacing:-0.03em; line-height:1.25; color:var(--sec); }
      .layer { position:absolute; inset:0; }
      .demo-label { position:absolute; left:60px; top:1740px; font-weight:700; font-size:22px; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase; }
      .sample { position:absolute; font-weight:700; font-size:20px; letter-spacing:0.16em; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 18px; }
      #q { position:absolute; left:80px; right:80px; top:560px; text-align:center; }
      #gcard { position:absolute; left:140px; top:800px; width:800px; height:520px; background:#fff; border:1px solid var(--line); border-radius:36px; box-shadow:0 30px 80px rgba(22,27,38,0.10); }
      #gcard .o { margin:34px 40px 0; height:110px; border:2px solid var(--line); border-radius:22px; display:flex; align-items:center; padding:0 30px; font-weight:700; font-size:34px; color:var(--sec); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30">
      <div id="all" class="clip" data-start="0" data-duration="3" data-track-index="0" style="position:absolute; inset:0" data-layout-allow-overflow data-layout-allow-occlusion>

        <div id="q" class="big">Which job do you automate first?</div>
        <div id="gcard"><div class="o">Client reports?</div><div class="o">Approval chasing?</div><div class="o">Status updates?</div></div>
        <div id="stamps" class="layer"></div>
        <div class="demo-label">move · stampSlam</div>
      </div>
    </div>
    <script src="moves.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 3);

      HRMoves.wordBuild(tl, "#q", 0.1, { s: 0.06 });
      HRMoves.blurIn(tl, "#gcard", 0.5);
      HRMoves.stampSlam(tl, "#stamps", 1.5, { text: "A GUESS", x: 560, y: 1240, shake: "#gcard" });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
