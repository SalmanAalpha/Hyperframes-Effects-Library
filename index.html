<h2 data-cat="Chat + social proof">Chat + social proof</h2>

  <figcaption><code>slack-notification-ad</code><span class="cat">Chat + social proof</span>
  <p>A portrait lock screen fills with escalating Slack video requests before HeyGen delivers the payoff</p></figcaption></figure>

  <figcaption><code>notification-pileup</code><span class="cat">Chat + social proof</span>

  <p>The measured conversation as one mountable scene at full fidelity: status bar, back badge, avatar and name pill, bubbles with real iMessage tails, a Delivered receipt, large emoji rows, a media placeholder, a link card, and typing dots holding the beat. Every message picks its type by prefix - recv:/sent: text, emoji: a large row, img media, card:Title~domain a link card - and heights are measured at mount so any thread fits</p></figcaption></figure>

  <p>A question is typed on a rising keyboard, sent, and answered by an AI that streams its reply word by word on a measured token rhythm - thinking dot, uneven bursts, bulleted list - before the app cuts to a branded closing card</p></figcaption></figure>
<figure data-cat="Chat + social proof"><video src="clips/chat-social-proof/claude-exchange.mp4" poster="thumbs/chat-social-proof/claude-exchange.jpg" autoplay muted loop playsinline preload="metadata"></video>
  <figcaption><code>claude-exchange</code><span class="cat">Chat + social proof</span>
  <p>A portrait Claude-style exchange types a prompt, works through search and reasoning steps, then streams a detailed answer with citations and actions</p></figcaption></figure>
<figure data-cat="Chat + social proof"><video src="clips/chat-social-proof/x-post.mp4" poster="thumbs/chat-social-proof/x-post.jpg" autoplay muted loop playsinline preload="metadata"></video>

<figure data-cat="Chat + social proof"><video src="clips/chat-social-proof/reddit-post.mp4" poster="thumbs/chat-social-proof/reddit-post.jpg" autoplay muted loop playsinline preload="metadata"></video>

<figure data-cat="Chat + social proof"><video src="clips/chat-social-proof/testimonial-proof-card.mp4" poster="thumbs/chat-social-proof/testimonial-proof-card.jpg" autoplay muted loop playsinline preload="metadata"></video>

<figure data-cat="Chat + social proof"><video src="clips/chat-social-proof/social-proof-card.mp4" poster="thumbs/chat-social-proof/social-proof-card.jpg" autoplay muted loop playsinline preload="metadata"></video>
